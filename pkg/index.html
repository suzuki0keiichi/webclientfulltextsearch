<!DOCTYPE html>
<html lang="ja">
<head>
    <title>Client-side Full-text Search</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 1rem; }
        #status { color: #666; margin-bottom: 1rem; }
        .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .search-bar input[type="text"] { flex: 1; padding: 0.5rem; font-size: 1rem; }
        .search-bar button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        .search-help { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
        .result-item { border-bottom: 1px solid #eee; padding: 0.75rem 0; }
        .result-title { font-weight: bold; color: #1a0dab; }
        .result-meta { font-size: 0.8rem; color: #006621; margin: 0.2rem 0; }
        .result-desc { font-size: 0.9rem; color: #545454; }
    </style>
    <script type="module" src="./main.js"></script>
</head>
<body>
    <h1>Client-side Full-text Search</h1>
    <div id="status">読み込み中...</div>
    <div class="search-bar">
        <input type="text" id="search_word" placeholder="検索キーワード"/>
        <button id="search_button">検索</button>
    </div>
    <div class="search-help">
        AND: <code>word1 word2</code> &nbsp;
        OR: <code>word1 OR word2</code> &nbsp;
        NOT: <code>-word</code> &nbsp;
        フレーズ: <code>"exact phrase"</code> &nbsp;
        フィールド: <code>title:word</code>
    </div>
    <div id="results"></div>
</body>
</html>
